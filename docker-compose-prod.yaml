services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27018:27017"
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: duckhoa2707/product-api:latest
    container_name: product-api-prod
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_prod_data: